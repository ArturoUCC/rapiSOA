# Nombre de la aplicacion
spring.application.name=rapi

# Puerto del servidor
server.port=1500

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/rapientrega
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Modos de prueba desactivados por defecto
rapi.pagos.modo-pruebas=${RAPI_PAGOS_MODO_PRUEBAS:false}
rapi.facturacion.modo-pruebas=${RAPI_FACTURACION_MODO_PRUEBAS:false}
